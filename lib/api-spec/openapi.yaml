openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Voice Training Programme Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: programmes
    description: Training programme operations
  - name: parse
    description: Voice transcript parsing
  - name: clients
    description: Client management
  - name: nutrition
    description: Client nutrition diary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /programmes:
    get:
      operationId: listProgrammes
      tags: [programmes]
      summary: List all programmes
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
          description: If provided, returns programmes assigned to this client. Otherwise returns master programmes.
      responses:
        "200":
          description: List of programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Programme"
    post:
      operationId: createProgramme
      tags: [programmes]
      summary: Create a new programme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgrammeBody"
      responses:
        "201":
          description: Programme created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"

  /programmes/{id}:
    get:
      operationId: getProgramme
      tags: [programmes]
      summary: Get a programme by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Programme details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProgramme
      tags: [programmes]
      summary: Update a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgrammeBody"
      responses:
        "200":
          description: Programme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramme
      tags: [programmes]
      summary: Delete a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /programmes/{id}/duplicate:
    post:
      operationId: duplicateProgramme
      tags: [programmes]
      summary: Duplicate a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parse:
    post:
      operationId: parseTranscript
      tags: [parse]
      summary: Parse a voice transcript into structured exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseTranscriptBody"
      responses:
        "200":
          description: Parsed exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseTranscriptResponse"

  /calendar-command:
    post:
      operationId: calendarCommand
      tags: [parse]
      summary: Execute a natural language command on the calendar sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarCommandBody"
      responses:
        "200":
          description: Updated sessions and change summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarCommandResponse"

  /parse-log:
    post:
      operationId: parseLog
      tags: [parse]
      summary: Parse a client's spoken workout log into per-set data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseLogBody"
      responses:
        "200":
          description: Parsed set logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseLogResponse"

  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [parse]
      summary: Transcribe audio to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
              required:
                - audio
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}/nutrition:
    get:
      operationId: listNutritionEntries
      tags: [nutrition]
      summary: List nutrition entries for a client on a given date
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Nutrition entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NutritionEntry"
    post:
      operationId: addNutritionEntry
      tags: [nutrition]
      summary: Add a nutrition entry (AI-parsed macros)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                date:
                  type: string
              required: [description, date]
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionEntry"

  /clients/{clientId}/nutrition/{entryId}:
    delete:
      operationId: deleteNutritionEntry
      tags: [nutrition]
      summary: Delete a nutrition entry
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{clientId}/assign-programme:
    post:
      operationId: assignProgramme
      tags: [clients]
      summary: Assign a master programme to a client, re-dated from a given start date
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignProgrammeBody"
      responses:
        "201":
          description: Assigned programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Source programme not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    WeekProgression:
      type: object
      properties:
        week:
          type: integer
        sets:
          type: ["integer", "null"]
        reps:
          type: ["string", "null"]
        rpe:
          type: ["string", "null"]
        weight:
          type: ["string", "null"]
      required:
        - week

    Exercise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sets:
          type: ["integer", "null"]
        reps:
          type: ["string", "null"]
        rpe:
          type: ["string", "null"]
        rest:
          type: ["string", "null"]
        tempo:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        rawText:
          type: ["string", "null"]
        weekProgression:
          type: array
          items:
            $ref: "#/components/schemas/WeekProgression"
        clientComment:
          type: ["string", "null"]
          description: Client's post-set comment for the coach
        perSetReps:
          type: array
          description: Coach-prescribed reps per set (overrides global reps when present)
          items:
            type: ["string", "null"]
        perSetRpe:
          type: array
          description: Coach-prescribed RPE per set (overrides global rpe when present)
          items:
            type: ["string", "null"]
        setWeights:
          type: array
          description: Weight in kg logged by client for each set
          items:
            type: ["number", "null"]
        setReps:
          type: array
          description: Actual reps achieved per set, logged by client
          items:
            type: ["number", "null"]
      required:
        - id
        - name

    Session:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          description: ISO date string e.g. 2026-03-23
        name:
          type: ["string", "null"]
          description: Session label e.g. Quads, Upper Body
        color:
          type: ["string", "null"]
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
      required:
        - id
        - date
        - exercises

    Programme:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        clientId:
          type: integer
          nullable: true
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - sessions
        - createdAt
        - updatedAt

    CreateProgrammeBody:
      type: object
      properties:
        title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
      required:
        - title

    AssignProgrammeBody:
      type: object
      properties:
        sourceProgrammeId:
          type: integer
        startDate:
          type: string
          format: date
      required:
        - sourceProgrammeId
        - startDate

    UpdateProgrammeBody:
      type: object
      properties:
        title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    CalendarCommandBody:
      type: object
      properties:
        command:
          type: string
          description: Natural language command to execute on the calendar
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        referenceDate:
          type: string
          description: ISO date string (yyyy-MM-dd) representing today/current date for resolving relative date references
      required:
        - command
        - sessions
        - referenceDate

    CalendarCommandResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        changes:
          type: array
          items:
            type: string
      required:
        - sessions
        - changes

    SetLog:
      type: object
      properties:
        setIndex:
          type: integer
          description: Zero-based set index
        weight:
          type: ["number", "null"]
        reps:
          type: ["integer", "null"]
      required:
        - setIndex

    ParseLogBody:
      type: object
      properties:
        transcript:
          type: string
        exerciseName:
          type: string
        totalSets:
          type: integer
      required:
        - transcript
        - exerciseName
        - totalSets

    ParseLogResponse:
      type: object
      properties:
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SetLog"
      required:
        - sets

    ParseTranscriptBody:
      type: object
      properties:
        transcript:
          type: string
        existingExercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
      required:
        - transcript

    ParseTranscriptResponse:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        rawTranscript:
          type: string
        changes:
          type: array
          items:
            type: string
          description: Human-readable list of what changed (e.g. "Updated bench press sets to 5", "Removed lat pulldown")
      required:
        - exercises
        - rawTranscript

    TranscribeResponse:
      type: object
      properties:
        transcript:
          type: string
      required:
        - transcript

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]

    NutritionEntry:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        date:
          type: string
        description:
          type: string
        calories:
          type: ["integer", "null"]
        protein:
          type: ["string", "null"]
        carbs:
          type: ["string", "null"]
        fats:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, clientId, date, description, createdAt]
