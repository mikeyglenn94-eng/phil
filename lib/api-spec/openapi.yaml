openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Voice Training Programme Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: programmes
    description: Training programme operations
  - name: parse
    description: Voice transcript parsing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /programmes:
    get:
      operationId: listProgrammes
      tags: [programmes]
      summary: List all programmes
      responses:
        "200":
          description: List of programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Programme"
    post:
      operationId: createProgramme
      tags: [programmes]
      summary: Create a new programme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgrammeBody"
      responses:
        "201":
          description: Programme created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"

  /programmes/{id}:
    get:
      operationId: getProgramme
      tags: [programmes]
      summary: Get a programme by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Programme details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProgramme
      tags: [programmes]
      summary: Update a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgrammeBody"
      responses:
        "200":
          description: Programme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramme
      tags: [programmes]
      summary: Delete a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /programmes/{id}/duplicate:
    post:
      operationId: duplicateProgramme
      tags: [programmes]
      summary: Duplicate a programme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parse:
    post:
      operationId: parseTranscript
      tags: [parse]
      summary: Parse a voice transcript into structured exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseTranscriptBody"
      responses:
        "200":
          description: Parsed exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseTranscriptResponse"

  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [parse]
      summary: Transcribe audio to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
              required:
                - audio
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    WeekProgression:
      type: object
      properties:
        week:
          type: integer
        sets:
          type: ["integer", "null"]
        reps:
          type: ["string", "null"]
        rpe:
          type: ["string", "null"]
        weight:
          type: ["string", "null"]
      required:
        - week

    Exercise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sets:
          type: ["integer", "null"]
        reps:
          type: ["string", "null"]
        rpe:
          type: ["string", "null"]
        rest:
          type: ["string", "null"]
        tempo:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        rawText:
          type: ["string", "null"]
        weekProgression:
          type: array
          items:
            $ref: "#/components/schemas/WeekProgression"
        setWeights:
          type: array
          description: Weight in kg logged by client for each set
          items:
            type: ["number", "null"]
      required:
        - id
        - name

    Session:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          description: ISO date string e.g. 2026-03-23
        name:
          type: ["string", "null"]
          description: Session label e.g. Quads, Upper Body
        color:
          type: ["string", "null"]
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
      required:
        - id
        - date
        - exercises

    Programme:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - sessions
        - createdAt
        - updatedAt

    CreateProgrammeBody:
      type: object
      properties:
        title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
      required:
        - title

    UpdateProgrammeBody:
      type: object
      properties:
        title:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    ParseTranscriptBody:
      type: object
      properties:
        transcript:
          type: string
        existingExercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
      required:
        - transcript

    ParseTranscriptResponse:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        rawTranscript:
          type: string
      required:
        - exercises
        - rawTranscript

    TranscribeResponse:
      type: object
      properties:
        transcript:
          type: string
      required:
        - transcript
